<!DOCTYPE html>
<html>

<head>
    <title>NativeSync — Doc Summarizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #000;
            overflow-x: hidden;
        }

        body {
            color: #e8e8ec;
            font-family: 'JetBrains Mono', monospace;
            padding: 30px 20px 80px;
            min-height: 100vh;
            position: relative;
        }

        #starfield {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .header h1 {
            font-family: 'DotGothic16', monospace;
            font-size: 26px;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .header h1 .accent {
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.6);
        }

        .header a {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .header a:hover {
            color: #ff1a1a;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.1s;
        }

        label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .dropzone {
            border: 1px dashed #262626;
            border-radius: 5px;
            background: #050505;
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #888;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: #ff1a1a;
            color: #e8e8ec;
        }

        .dropzone input {
            display: none;
        }

        .filename {
            margin-top: 8px;
            font-size: 12px;
            color: #fff;
        }

        .question-row {
            margin-top: 18px;
        }

        input[type="text"] {
            font-family: 'JetBrains Mono', monospace;
            background: #050505;
            border: 1px solid #262626;
            color: #e8e8ec;
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 13px;
            width: 100%;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff1a1a;
        }

        button {
            font-family: 'JetBrains Mono', monospace;
            background: #ff1a1a;
            color: #000;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 12px 22px;
            font-size: 13px;
            width: 100%;
            margin-top: 18px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        button:hover {
            background: #ff4444;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #status {
            text-align: center;
            font-size: 12px;
            color: #888;
            min-height: 16px;
            margin: 16px 0;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #333;
            border-top-color: #ff1a1a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: -2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            font-size: 14px;
            line-height: 1.7;
            color: #d8d8dc;
            white-space: pre-wrap;
            display: none;
        }

        .result.visible {
            display: block;
            animation: riseIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .example {
            font-size: 11px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="page">
        <div class="header">
            <h1>DOCUMENT <span class="accent">SUMMARIZER</span></h1>
            <a href="/">&lt; back to NativeSync</a>
        </div>

        <div class="container">
            <div class="card">
                <label>File</label>
                <div class="dropzone" id="dropzone">
                    <span id="dropzoneText">click to choose, or drag a PDF / DOCX here</span>
                    <div class="filename" id="filename"></div>
                    <input type="file" id="fileInput" accept=".pdf,.docx">
                </div>
                <div class="example">PDF or DOCX only</div>

                <div class="question-row">
                    <label>Question (optional — leave blank for a summary)</label>
                    <input id="questionInput" type="text" placeholder="e.g. what does this say about pricing?">
                </div>

                <button id="submitBtn" onclick="processDoc()">Summarize</button>
            </div>

            <p id="status"></p>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let stars = [];
        const numStars = 350;

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * canvas.width,
                    y: (Math.random() - 0.5) * canvas.height,
                    z: Math.random() * canvas.width,
                    isRed: Math.random() < 0.35
                });
            }
        }
        initStars();

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            for (let s of stars) {
                const prevZ = s.z;
                s.z -= 6;

                if (s.z <= 0) {
                    s.x = (Math.random() - 0.5) * canvas.width;
                    s.y = (Math.random() - 0.5) * canvas.height;
                    s.z = canvas.width;
                    s.isRed = Math.random() < 0.35;
                    continue;
                }

                const sx = (s.x / s.z) * canvas.width + cx;
                const sy = (s.y / s.z) * canvas.width + cy;
                const px = (s.x / prevZ) * canvas.width + cx;
                const py = (s.y / prevZ) * canvas.width + cy;

                const size = (1 - s.z / canvas.width) * 1.8;
                const alpha = (1 - s.z / canvas.width) * 0.7;

                if (s.isRed) {
                    ctx.strokeStyle = `rgba(255,20,20,${Math.min(alpha * 1.3, 1)})`;
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = 'rgba(255,0,60,1)';
                } else {
                    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                }

                ctx.lineWidth = size;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }
        draw();

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const dropzoneText = document.getElementById('dropzoneText');
        const filenameEl = document.getElementById('filename');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                showFilename();
            }
        });
        fileInput.addEventListener('change', showFilename);

        function showFilename() {
            if (fileInput.files.length) {
                filenameEl.textContent = fileInput.files[0].name;
                dropzoneText.style.display = 'none';
            }
        }

        const questionInput = document.getElementById('questionInput');
        const submitBtn = document.getElementById('submitBtn');
        questionInput.addEventListener('input', () => {
            submitBtn.innerText = questionInput.value.trim() ? 'Ask' : 'Summarize';
        });

        async function processDoc() {
            const resultEl = document.getElementById("result");

            if (!fileInput.files.length) {
                setStatus("Pick a PDF or DOCX file first.");
                return;
            }

            const isQuestion = questionInput.value.trim().length > 0;

            submitBtn.disabled = true;
            submitBtn.innerText = "Working...";
            resultEl.classList.remove("visible");
            setStatus(`<span class="spinner"></span>${isQuestion ? "Reading the document and answering..." : "Reading the document and summarizing..."}`);

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            if (isQuestion) {
                formData.append("question", questionInput.value.trim());
            }

            try {
                const res = await fetch("/api/summarize-doc", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (data.status === "success") {
                    resultEl.innerText = data.summary;
                    resultEl.classList.add("visible");
                    setStatus("Done.");
                } else {
                    setStatus("Failed: " + (data.error || "unknown error"));
                }
            } catch (e) {
                setStatus("Something went wrong. Check the file and try again.");
            }

            submitBtn.disabled = false;
            submitBtn.innerText = isQuestion ? "Ask" : "Summarize";
        }

        function setStatus(html) {
            document.getElementById("status").innerHTML = html;
        }
    </script>
</body>

</html>
