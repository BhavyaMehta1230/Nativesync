<!DOCTYPE html>
<html>

<head>
    <title>NativeSync — Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #000;
            overflow-x: hidden;
        }

        body {
            color: #e8e8ec;
            font-family: 'JetBrains Mono', monospace;
            padding: 30px 20px 80px;
            min-height: 100vh;
            position: relative;
        }

        #starfield {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .header h1 {
            font-family: 'DotGothic16', monospace;
            font-size: 26px;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .header h1 .accent {
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.6);
        }

        .header a {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .header a:hover {
            color: #ff1a1a;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input,
        textarea {
            font-family: 'JetBrains Mono', monospace;
            background: #050505;
            border: 1px solid #262626;
            color: #e8e8ec;
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 13px;
            flex: 1;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ff1a1a;
        }

        button {
            font-family: 'JetBrains Mono', monospace;
            background: #ff1a1a;
            color: #000;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 12px 22px;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        button:hover {
            background: #ff4444;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #status {
            text-align: center;
            font-size: 12px;
            color: #888;
            min-height: 16px;
            margin: 16px 0;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #333;
            border-top-color: #ff1a1a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: -2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .example {
            font-size: 11px;
            color: #555;
            margin-top: 10px;
        }

        .event-card {
            background: rgba(13, 13, 13, 0.85);
            border: 1px solid #1e1e1e;
            border-left: 3px solid #ff1a1a;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 10px;
        }

        .event-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .event-time {
            font-size: 12px;
            color: #888;
        }

        .event-desc {
            font-size: 12px;
            color: #aaa;
            margin-top: 6px;
        }

        .empty-state {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="page">
        <div class="header">
            <h1>CALENDAR <span class="accent">/ TASKS</span></h1>
            <a href="/">&lt; back to NativeSync</a>
        </div>

        <div class="container">
            <div class="card">
                <div class="input-row">
                    <input id="instructionInput" type="text"
                        placeholder="e.g. schedule a call with Sam tomorrow at 4pm">
                    <button id="createBtn" onclick="createEvent()">Create</button>
                </div>
                <div class="example">Describe the event in plain language — date, time, and title. Defaults to 1 hour if
                    no duration is given.</div>
            </div>

            <p id="status"></p>

            <div id="eventList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        let stars = [];
        const numStars = 350;
        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * canvas.width,
                    y: (Math.random() - 0.5) * canvas.height,
                    z: Math.random() * canvas.width,
                    isRed: Math.random() < 0.35
                });
            }
        }
        initStars();

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2;
            for (let s of stars) {
                const prevZ = s.z;
                s.z -= 6;
                if (s.z <= 0) {
                    s.x = (Math.random() - 0.5) * canvas.width;
                    s.y = (Math.random() - 0.5) * canvas.height;
                    s.z = canvas.width;
                    s.isRed = Math.random() < 0.35;
                    continue;
                }
                const sx = (s.x / s.z) * canvas.width + cx;
                const sy = (s.y / s.z) * canvas.width + cy;
                const px = (s.x / prevZ) * canvas.width + cx;
                const py = (s.y / prevZ) * canvas.width + cy;
                const size = (1 - s.z / canvas.width) * 1.8;
                const alpha = (1 - s.z / canvas.width) * 0.7;
                if (s.isRed) {
                    ctx.strokeStyle = `rgba(255,20,20,${Math.min(alpha * 1.3, 1)})`;
                    ctx.shadowBlur = 16;
                    ctx.shadowColor = 'rgba(255,0,60,1)';
                } else {
                    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                }
                ctx.lineWidth = size;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(draw);
        }
        draw();

        function setStatus(html) { document.getElementById("status").innerHTML = html; }

        function formatDateTime(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            } catch (e) {
                return iso;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadEvents() {
            const listEl = document.getElementById("eventList");
            try {
                const res = await fetch("/api/calendar-events");
                const data = await res.json();

                if (data.status !== "success") {
                    listEl.innerHTML = `<div class="empty-state">Could not load events: ${escapeHtml(data.error || "unknown error")}</div>`;
                    return;
                }

                if (data.events.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">No upcoming events.</div>';
                    return;
                }

                listEl.innerHTML = "";
                data.events.forEach(ev => {
                    const div = document.createElement("div");
                    div.className = "event-card";
                    div.innerHTML = `
                        <div class="event-title">${escapeHtml(ev.summary)}</div>
                        <div class="event-time">${formatDateTime(ev.start)} — ${formatDateTime(ev.end)}</div>
                        ${ev.description ? `<div class="event-desc">${escapeHtml(ev.description)}</div>` : ""}
                    `;
                    listEl.appendChild(div);
                });
            } catch (e) {
                listEl.innerHTML = '<div class="empty-state">Could not load events.</div>';
            }
        }
        loadEvents();

        async function createEvent() {
            const instruction = document.getElementById("instructionInput").value.trim();
            const btn = document.getElementById("createBtn");

            if (!instruction) {
                setStatus("Describe the event first.");
                return;
            }

            btn.disabled = true;
            setStatus('<span class="spinner"></span>Creating event (this may open a Google login window the first time)...');

            try {
                const res = await fetch("/api/create-event", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ instruction: instruction })
                });
                const data = await res.json();

                if (data.status === "success") {
                    setStatus(`Created: "${data.event.summary}"`);
                    document.getElementById("instructionInput").value = "";
                    loadEvents();
                } else {
                    setStatus("Failed: " + (data.error || "unknown error"));
                }
            } catch (e) {
                setStatus("Something went wrong creating the event.");
            }

            btn.disabled = false;
        }

        document.getElementById("instructionInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") createEvent();
        });
    </script>
</body>

</html>
