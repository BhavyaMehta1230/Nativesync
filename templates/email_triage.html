<!DOCTYPE html>
<html>

<head>
    <title>NativeSync — Email Triage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #000;
            overflow-x: hidden;
        }

        body {
            color: #e8e8ec;
            font-family: 'JetBrains Mono', monospace;
            padding: 30px 20px 80px;
            min-height: 100vh;
            position: relative;
        }

        #starfield {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .header h1 {
            font-family: 'DotGothic16', monospace;
            font-size: 26px;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .header h1 .accent {
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.6);
        }

        .header a {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .header a:hover {
            color: #ff1a1a;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        button.refresh {
            font-family: 'JetBrains Mono', monospace;
            background: #ff1a1a;
            color: #000;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 12px 26px;
            font-size: 13px;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        button.refresh:hover {
            background: #ff4444;
        }

        button.refresh:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #status {
            text-align: center;
            font-size: 12px;
            color: #888;
            min-height: 16px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #333;
            border-top-color: #ff1a1a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: -2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .email-card {
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid #1e1e1e;
            border-left: 3px solid #333;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 14px;
            animation: riseIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .email-card.urgent {
            border-left-color: #ff1a1a;
        }

        .email-card.normal {
            border-left-color: #666;
        }

        .email-card.low {
            border-left-color: #2a2a2a;
            opacity: 0.7;
        }

        .email-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .email-subject {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .email-from {
            font-size: 11px;
            color: #777;
            margin-top: 3px;
        }

        .badge {
            font-size: 9px;
            letter-spacing: 1.5px;
            padding: 4px 8px;
            border-radius: 3px;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .badge.urgent {
            background: rgba(255, 26, 26, 0.15);
            color: #ff4444;
        }

        .badge.normal {
            background: rgba(255, 255, 255, 0.08);
            color: #999;
        }

        .badge.low {
            background: rgba(255, 255, 255, 0.04);
            color: #555;
        }

        .email-reason {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }

        .email-snippet {
            font-size: 12px;
            color: #999;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .draft-box {
            background: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.6;
            color: #d8d8dc;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .draft-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 40px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px 60px;
            }

            .header h1 {
                font-size: 22px;
                letter-spacing: 3px;
            }

            button.refresh {
                width: 100%;
                padding: 14px;
                font-size: 14px;
                min-height: 46px;
            }

            .email-card {
                padding: 14px 14px;
            }

            .email-top {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 6px;
            }

            .email-subject {
                font-size: 13px;
            }

            .email-snippet {
                font-size: 11px;
            }

            .draft-box {
                font-size: 11px;
                padding: 10px 12px;
            }
        }

        @media (max-width: 360px) {
            .header h1 {
                font-size: 18px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="page">
        <div class="header">
            <h1>EMAIL <span class="accent">TRIAGE</span></h1>
            <a href="/">&lt; back to NativeSync</a>
        </div>

        <div class="container">
            <div class="toolbar">
                <button class="refresh" id="refreshBtn" onclick="loadEmails()">Scan Inbox</button>
            </div>

            <p id="status"></p>

            <div id="emailList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let isMobile = window.innerWidth < 768;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const newIsMobile = window.innerWidth < 768;
            if (newIsMobile !== isMobile) {
                isMobile = newIsMobile;
                initStars();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        let stars = [];

        function initStars() {
            stars = [];
            const numStars = isMobile ? 120 : 350;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * canvas.width,
                    y: (Math.random() - 0.5) * canvas.height,
                    z: Math.random() * canvas.width,
                    isRed: Math.random() < 0.35
                });
            }
        }
        initStars();

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            for (let s of stars) {
                const prevZ = s.z;
                s.z -= 6;
                if (s.z <= 0) {
                    s.x = (Math.random() - 0.5) * canvas.width;
                    s.y = (Math.random() - 0.5) * canvas.height;
                    s.z = canvas.width;
                    s.isRed = Math.random() < 0.35;
                    continue;
                }
                const sx = (s.x / s.z) * canvas.width + cx;
                const sy = (s.y / s.z) * canvas.width + cy;
                const px = (s.x / prevZ) * canvas.width + cx;
                const py = (s.y / prevZ) * canvas.width + cy;
                const size = (1 - s.z / canvas.width) * 1.8;
                const alpha = (1 - s.z / canvas.width) * 0.7;

                if (s.isRed) {
                    ctx.strokeStyle = `rgba(255,20,20,${Math.min(alpha * 1.3, 1)})`;
                    ctx.shadowBlur = isMobile ? 0 : 16;
                    ctx.shadowColor = 'rgba(255,0,60,1)';
                } else {
                    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                }
                ctx.lineWidth = size;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(draw);
        }
        draw();

        function setStatus(html) {
            document.getElementById("status").innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadEmails() {
            const btn = document.getElementById("refreshBtn");
            const listEl = document.getElementById("emailList");

            btn.disabled = true;
            listEl.innerHTML = "";
            setStatus('<span class="spinner"></span>Reading your inbox and triaging (this may open a Google login window the first time)...');

            try {
                const res = await fetch("/api/triage-emails");
                const data = await res.json();

                if (data.status !== "success") {
                    setStatus("Failed: " + (data.error || "unknown error"));
                    btn.disabled = false;
                    return;
                }

                if (data.emails.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">No unread emails. Inbox is clear.</div>';
                    setStatus("Done.");
                    btn.disabled = false;
                    return;
                }

                data.emails.forEach(email => {
                    const card = document.createElement("div");
                    card.className = `email-card ${email.priority}`;

                    let draftHtml = "";
                    if (email.draft_reply) {
                        draftHtml = `
                            <div class="draft-label">Suggested reply</div>
                            <div class="draft-box">${escapeHtml(email.draft_reply)}</div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="email-top">
                            <div>
                                <div class="email-subject">${escapeHtml(email.subject)}</div>
                                <div class="email-from">${escapeHtml(email.from)}</div>
                            </div>
                            <div class="badge ${email.priority}">${email.priority}</div>
                        </div>
                        <div class="email-reason">${escapeHtml(email.reason)}</div>
                        <div class="email-snippet">${escapeHtml(email.snippet)}</div>
                        ${draftHtml}
                    `;
                    listEl.appendChild(card);
                });

                setStatus(`Triaged ${data.emails.length} unread email(s).`);
            } catch (e) {
                setStatus("Something went wrong. Check your server terminal for errors.");
            }

            btn.disabled = false;
        }
    </script>
</body>

</html>
